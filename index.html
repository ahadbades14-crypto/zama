<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAMA - Traducteur Bénin</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#FF6B35;min-height:100vh;padding:15px}
      .container{max-width:400px;margin:0 auto;background:white;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
        h1{text-align:center;color:#FF6B35;font-size:2.5em;margin-bottom:5px;font-weight:900}
      .subtitle{text-align:center;color:#666;margin-bottom:15px;font-size:0.9em}
        textarea{width:100%;padding:15px;border:2px solid #FF6B35;border-radius:10px;font-size:16px;min-height:80px;resize:none}
        select{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:10px;font-size:16px;background:white}
        button{width:100%;padding:15px;background:#FF6B35;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin:8px 0;cursor:pointer}
        button:active{transform:scale(0.98)}
      .btn-small{width:48%;display:inline-block;font-size:14px;padding:12px}
      .result{background:#f8f8f8;padding:15px;border-radius:10px;min-height:80px;border:2px dashed #ddd;white-space:pre-wrap}
      .tools{display:flex;justify-content:space-between;margin:8px 0}
      .listening{background:#00C853!important}
       #photoInput{display:none}
    </style>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body>
    <div class="container">
        <h1>ZAMA</h1>
        <p class="subtitle">59 Langues + Langues Bénin 🇧🇯</p>
        
        <textarea id="inputText" placeholder="Écris ou parle...">Bonjour</textarea>
        
        <div class="tools">
            <button class="btn-small" onclick="startVoice()" id="micBtn">🎤 Parler</button>
            <button class="btn-small" onclick="document.getElementById('photoInput').click()">📷 Photo</button>
        </div>
        <input type="file" id="photoInput" accept="image/*" onchange="readPhoto(event)">
        
        <select id="fromLang">
            <option value="fr">Français</option>
            <option value="fon">Fon - Fɔngbé 🇧🇯</option>
            <option value="yor">Yoruba - Yorùbá 🇧🇯</option>
            <option value="en">Anglais</option>
            <option value="zh-CN">Chinois 🇨🇳</option>
            <option value="ar">Arabe</option>
        </select>
        
        <button onclick="swapLang()">↑↓ Inverser</button>
        
        <select id="toLang">
            <option value="fon">Fon - Fɔngbé 🇧🇯</option>
            <option value="fr">Français</option>
            <option value="yor">Yoruba - Yorùbá 🇧🇯</option>
            <option value="en">Anglais</option>
            <option value="zh-CN">Chinois 🇨🇳</option>
            <option value="ar">Arabe</option>
        </select>
        
        <button onclick="translate()">TRADUIRE</button>
        
        <div class="result" id="result">La traduction apparaît ici</div>
        <button onclick="speak()" style="background:#00C853">🔊 ÉCOUTER LA TRADUCTION</button>
    </div>

<script>
const FON = {"bonjour":"miɖɔ","merci":"kúkú","oui":"ɛɛn","non":"ɛɛó","eau":"sin","manger":"ɖu","maison":"xwé","argent":"akwɛ","venir":"wá","aller":"yi","bien":"ɖagbe","homme":"súnnu","femme":"nyɔnu","enfant":"vǐ","je t'aime":"un nyi wǎn na we","comment ça va":"a ɖo gbɛ a","ça va bien":"un ɖo gbɛ","pardon":"kɛnklɛn","au revoir":"yiɖé"};
const YOR = {"bonjour":"eku aro","merci":"ese","oui":"bẹẹni","non":"rara","eau":"omi","manger":"jẹun","maison":"ile","argent":"owo","venir":"wa","aller":"lo","je t'aime":"mo nifẹ rẹ"};

let lastTranslation = '';

function swapLang(){
    let from = document.getElementById('fromLang');
    let to = document.getElementById('toLang');
    [from.value, to.value] = [to.value, from.value];
}

async function translate(){
    const text = document.getElementById('inputText').value.trim().toLowerCase();
    const from = document.getElementById('fromLang').value;
    const to = document.getElementById('toLang').value;
    const res = document.getElementById('result');
    
    if(!text){res.innerHTML='Écris quelque chose';return;}
    if(from===to){res.innerHTML=text;lastTranslation=text;return;}
    
    res.innerHTML='Traduction...';
    
    // 1. DICO FON
    if(from==='fr' && to==='fon' && FON[text]){res.innerHTML=FON[text]+' [Dico ZAMA]';lastTranslation=FON[text];return;}
    if(from==='fon' && to==='fr'){for(let k in FON){if(FON[k]===text){res.innerHTML=k+' [Dico ZAMA]';lastTranslation=k;return;}}}
    
    // 2. DICO YORUBA 
    if(from==='fr' && to==='yor' && YOR[text]){res.innerHTML=YOR[text]+' [Dico ZAMA]';lastTranslation=YOR[text];return;}
    if(from==='yor' && to==='fr'){for(let k in YOR){if(YOR[k]===text){res.innerHTML=k+' [Dico ZAMA]';lastTranslation=k;return;}}}
    
    // 3. GOOGLE POUR 59 LANGUES + CHINOIS
    try{
        const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        lastTranslation = data[0][0][0];
        res.innerHTML=lastTranslation+' [Google]';
    }catch(e){
        res.innerHTML='Erreur. Active internet ou mot absent du dico offline.';
    }
}

// VOCAL - Parler pour écrire
function startVoice(){
    const micBtn = document.getElementById('micBtn');
    if(!('webkitSpeechRecognition' in window)){alert('Vocal pas supporté sur ce navigateur. Utilise Chrome.');return;}
    
    const recognition = new webkitSpeechRecognition();
    recognition.lang = document.getElementById('fromLang').value;
    recognition.start();
    micBtn.classList.add('listening');
    micBtn.innerHTML='🎤 ÉCOUTE...';
    
    recognition.onresult = (e)=>{
        document.getElementById('inputText').value = e.results[0][0].transcript;
        micBtn.classList.remove('listening');
        micBtn.innerHTML='🎤 Parler';
        translate();
    };
    recognition.onerror = ()=>{micBtn.classList.remove('listening');micBtn.innerHTML='🎤 Parler';};
}

// AUDIO - Lire la traduction
function speak(){
    if(!lastTranslation){alert('Traduis d\'abord');return;}
    const to = document.getElementById('toLang').value;
    const utterance = new SpeechSynthesisUtterance(lastTranslation);
    utterance.lang = to==='fon'||to==='yor'?'fr-FR':to; // Fon/Yoruba lus en français
    speechSynthesis.speak(utterance);
}

// PHOTO - Lire texte sur image
async function readPhoto(event){
    const file = event.target.files[0];
    if(!file) return;
    document.getElementById('result').innerHTML='Lecture photo...';
    const {data:{text}} = await Tesseract.recognize(file,'fra+eng');
    document.getElementById('inputText').value = text.trim();
    translate();
}

// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
    </html>
