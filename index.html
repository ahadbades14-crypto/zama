    <script>
        // Dico Fon-Français 60 mots offline
        const fonDico = {
            "a":"tu","un":"je","é":"il","mi":"nous","miɖɔ":"bonjour","nùɖé":"comment","aɖɔ":"ça va","ɛɛn":"oui","éé":"non",
            "kúkú":"merci","ɖagbé":"bien","nyì":"nom","xɔ":"maison","sìn":"eau","nùɖù":"nourriture","wémà":"livre",
            "àzɔ̌":"travail","àkwɛ́":"argent","vǐ":"enfant","dǎwe":"homme","nyɔ̌nu":"femme","tɔ́":"père","nɔ̀":"mère",
            "xɔ́ntɔ̀n":"ami","Bɛnɛɛ":"Bénin","yovo":"blanc","àzǎn":"jour","zǎn":"nuit","hwè":"soleil","sùn":"lune",
            "jǐ":"ciel","ayǐ":"terre","ató":"oreille","nukún":"œil","ɖà":"cheveux","tà":"tête","alɔ":"main","afɔ":"pied",
            "xwé":"année","sùn":"mois","gàn":"heure","ɖokpó":"un","wè":"deux","àtɔ̀n":"trois","ɛ̀nɛ":"quatre","àtɔ́ɔ́n":"cinq",
            "ayì":"cœur","lɛ̌n":"aimer","ɖù":"manger","nù":"boire","yì":"aller","wá":"venir","ɖɔ":"dire","sè":"entendre",
            "mɔ":"voir","nyɔ́":"bon","nyàn":"mauvais"
        };
        const frToFon = Object.fromEntries(Object.entries(fonDico).map(([k,v])=>[v,k]));

        // Dico Yoruba de base 20 mots
        const yoDico = {"bawo":"bonjour","se":"comment","dara":"ça va","beeni":"oui","rara":"non","ese":"merci","ile":"maison","omi":"eau","ounje":"nourriture","owo":"argent","omo":"enfant","okunrin":"homme","obirin":"femme","baba":"père","iya":"mère","ore":"ami","Benin":"Bénin","oju":"œil","ori":"tête","owo":"main"};
        const frToYo = Object.fromEntries(Object.entries(yoDico).map(([k,v])=>[v,k]));

        function switchLang() {
            let from = document.getElementById('fromLang');
            let to = document.getElementById('toLang');
            [from.value, to.value] = [to.value, from.value];
        }

        async function translate() {
            const text = document.getElementById('inputText').value.trim();
            const from = document.getElementById('fromLang').value;
            const to = document.getElementById('toLang').value;
            const resultDiv = document.getElementById('result');
            
            if(!text) return resultDiv.innerText = "Écris un texte d'abord";
            resultDiv.innerHTML = "Traduction...";

            // 1. FON OFFLINE
            if(from === 'fon' && to === 'fr') {
                let trad = text.toLowerCase().split(' ').map(m => fonDico[m] || m).join(' ');
                return resultDiv.innerHTML = trad + ' <span class="badge">Dico ZAMA</span>';
            }
            if(from === 'fr' && to === 'fon') {
                let trad = text.toLowerCase().split(' ').map(m => frToFon[m] || m).join(' ');
                return resultDiv.innerHTML = trad + ' <span class="badge">Dico ZAMA</span>';
            }

            // 2. YORUBA OFFLINE
            if(from === 'yo' && to === 'fr') {
                let trad = text.toLowerCase().split(' ').map(m => yoDico[m] || m).join(' ');
                return resultDiv.innerHTML = trad + ' <span class="badge">Dico ZAMA</span>';
            }
            if(from === 'fr' && to === 'yo') {
                let trad = text.toLowerCase().split(' ').map(m => frToYo[m] || m).join(' ');
                return resultDiv.innerHTML = trad + ' <span class="badge">Dico ZAMA</span>';
            }

            // 3. LANGUES BÉNIN NON SUPPORTÉES
            if(['dendi','bariba','adja'].includes(to) || ['dendi','bariba','adja'].includes(from)) {
                return resultDiv.innerHTML = 'Bientôt dispo sur ZAMA 🇧🇯 <span class="badge">Version 2</span>';
            }

            // 4. GOOGLE TRANSLATE POUR LES 59 AUTRES
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                resultDiv.innerHTML = data[0][0][0] + ' <span class="badge">Google</span>';
            } catch(e) {
                resultDiv.innerText = "Erreur. Active internet.";
            }
        }

        if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
